name: Build Path Bloom 1.1 Code 2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract preserved release project
        run: unzip -q path-bloom-1.1-code2-source.zip -d release_project
      - name: Build release bundle
        working-directory: release_project
        run: gradle --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: path-bloom-1.1-code2-unsigned-aab
          path: release_project/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
